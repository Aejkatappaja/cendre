# cendre · hard · https://github.com/Aejkatappaja/cendre
# generated by scripts/extras.lua, do not edit
# source-file ~/.config/tmux/cendre.tmux.conf

# The bar sits on bg2, one layer above the buffer, and marks state with fills
# rather than with colour alone: the accent names the session, a bg4 fill marks the
# current window, and everything inactive stays ink on the bar's own ground.

set -g status-style "bg=#2a2422 fg=#e6d5c2"
set -g status-position bottom
set -g status-justify left
set -g status-left-length 200

set -g status-left "#[fg=#171311,bg=#ea9875,bold] #{session_name} #[fg=#e6d5c2,bg=#2a2422,nobold] "
set -g status-right "#[fg=#73665b]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD) "

set -g window-status-format "#[fg=#73665b,bg=#2a2422] #{window_index}:#{window_name}#{window_flags} "
set -g window-status-current-format "#[fg=#e6d5c2,bg=#463e3a,bold] #{window_index}:#{window_name}#{window_flags} "
set -g window-status-last-style "fg=#a09384"
set -g window-status-activity-style "fg=#f4a21c"

set -g pane-border-style "fg=#362f2c"
set -g pane-active-border-style "fg=#ea9875"

set -g message-style "bg=#2a2422 fg=#e6d5c2"
set -g message-command-style "bg=#2a2422 fg=#e6d5c2"

set -g mode-style "bg=#2f1e17 fg=#e6d5c2"
