# cendre palette for Starship · hard
# https://github.com/Aejkatappaja/cendre
# generated by scripts/extras.lua, do not edit
#
# Install: copy into ~/.config/starship.toml, or if you keep your own config,
# copy the [palettes.cendre] block and add `palette = "cendre"` at the top.

palette = "cendre"

[palettes.cendre]
bg      = "#171311"
fg      = "#e6d5c2"
fg_dim  = "#a09384"
comment = "#73665b"
cinder  = "#d1766e"
ember   = "#ea9875"
brass   = "#fcba81"
sap     = "#99af6b"
frost   = "#4e89a2"
error   = "#d25780"
warning = "#f4a21c"
ok      = "#43b16a"
info    = "#58bdff"

[directory]
style = "ember bold"

[git_branch]
style = "cinder"

[git_status]
style = "warning"

[cmd_duration]
style = "comment"

[character]
success_symbol = "[❯](ember)"
error_symbol = "[❯](error)"
vimcmd_symbol = "[❮](sap)"

[nodejs]
style = "sap"

[golang]
style = "frost"

[rust]
style = "cinder"

[python]
style = "brass"

[lua]
style = "frost"
