# cendre theme for Yazi · soft
# https://github.com/Aejkatappaja/cendre
# generated by scripts/extras.lua, do not edit
#
# The file preview highlights code through syntect, which reads a tmTheme
# rather than any key below. To put this palette there too:
#   cp extras/bat/cendre.tmTheme ~/.config/yazi/
#   then add syntect_theme = "cendre.tmTheme" under [mgr]
# It is not written here because a path that does not resolve leaves
# previews unhighlighted with no message.

[mgr]
cwd = { fg = "#ea9875" }
find_keyword = { fg = "#fcba81", bold = true }
find_position = { fg = "#ea9875", italic = true }
symlink_target = { fg = "#a09384", italic = true }
marker_copied = { fg = "#43b16a", bg = "#43b16a" }
marker_cut = { fg = "#d25780", bg = "#d25780" }
marker_marked = { fg = "#58bdff", bg = "#58bdff" }
marker_selected = { fg = "#ea9875", bg = "#ea9875" }
count_copied = { fg = "#231f1d", bg = "#43b16a" }
count_cut = { fg = "#231f1d", bg = "#d25780" }
count_selected = { fg = "#231f1d", bg = "#ea9875" }
border_style = { fg = "#443c39" }

[tabs]
active = { fg = "#231f1d", bg = "#ea9875", bold = true }
inactive = { fg = "#a09384", bg = "#2d2725" }

[mode]
normal_main = { fg = "#231f1d", bg = "#ea9875", bold = true }
normal_alt = { fg = "#ea9875", bg = "#37312e" }
select_main = { fg = "#231f1d", bg = "#58bdff", bold = true }
select_alt = { fg = "#58bdff", bg = "#37312e" }
unset_main = { fg = "#231f1d", bg = "#f4a21c", bold = true }
unset_alt = { fg = "#f4a21c", bg = "#37312e" }

[indicator]
parent = { bg = "#2d2725" }
current = { bg = "#2d2725" }
preview = { bg = "#2d2725" }

[status]
overall = { fg = "#e6d5c2", bg = "#37312e" }
perm_sep = { fg = "#4e4641" }
perm_type = { fg = "#4e89a2" }
perm_read = { fg = "#fcba81" }
perm_write = { fg = "#d25780" }
perm_exec = { fg = "#99af6b" }
progress_label = { fg = "#e6d5c2", bold = true }
progress_normal = { fg = "#ea9875", bg = "#37312e" }
progress_error = { fg = "#231f1d", bg = "#d25780" }

[which]
mask = { bg = "#1a1716" }
cand = { fg = "#ea9875" }
rest = { fg = "#73665b" }
desc = { fg = "#a09384" }
separator_style = { fg = "#443c39" }

[confirm]
border = { fg = "#443c39" }
title = { fg = "#ea9875" }
body = { fg = "#e6d5c2" }
list = { fg = "#a09384" }
btn_yes = { fg = "#231f1d", bg = "#ea9875", bold = true }
btn_no = { fg = "#a09384" }

[spot]
border = { fg = "#443c39" }
title = { fg = "#ea9875" }
tbl_col = { fg = "#4e89a2" }
tbl_cell = { fg = "#231f1d", bg = "#ea9875" }

[notify]
title_info = { fg = "#58bdff" }
title_warn = { fg = "#f4a21c" }
title_error = { fg = "#d25780" }

[pick]
border = { fg = "#443c39" }
active = { fg = "#ea9875", bold = true }
inactive = { fg = "#a09384" }

[input]
border = { fg = "#443c39" }
title = { fg = "#ea9875" }
value = { fg = "#e6d5c2" }
selected = { bg = "#3d2b23" }

[cmp]
border = { fg = "#443c39" }
active = { fg = "#231f1d", bg = "#ea9875" }
inactive = { fg = "#a09384" }

[tasks]
border = { fg = "#443c39" }
title = { fg = "#ea9875" }
hovered = { fg = "#ea9875", bold = true }

[help]
on = { fg = "#ea9875" }
run = { fg = "#fcba81" }
desc = { fg = "#a09384" }
hovered = { bg = "#2d2725", bold = true }
footer = { fg = "#a09384", bg = "#2d2725" }

[filetype]
rules = [
  # Image
  { mime = "image/*", fg = "#fcba81" },
  # Media
  { mime = "{audio,video}/*", fg = "#9480ba" },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d1766e" },
  # Document
  { mime = "application/{pdf,doc,rtf}", fg = "#4e89a2" },
  # Virtual file system
  { mime = "vfs/{absent,stale}", fg = "#73665b" },
  # Broken link, and a file yazi could not read
  { url = "*", is = "orphan", bg = "#d25780" },
  { url = "*", is = "dummy", bg = "#d25780" },
  { url = "*/", is = "dummy", bg = "#d25780" },
  # Executable
  { url = "*", is = "exec", fg = "#99af6b" },
  # Directory, last so the globs above win
  { url = "*/", fg = "#ea9875" }
]
